<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="crt-noise" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="control-panel">
        <p class="panel-kicker">Shipboard Utility</p>
        <h1>Dice Core</h1>
        <button id="rollButton" class="roll-button">Roll!</button>
        <div id="sliderContainer" class="slider-grid"></div>
        <div class="slider-row">
          <label class="slider-label" for="zoomSlider">zoom</label>
          <output id="zoomValue" class="slider-value">64%</output>
          <input
            id="zoomSlider"
            class="die-slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="64"
          />
        </div>
      </aside>
      <main class="viewport-panel">
        <div id="renderHost" class="render-host" aria-label="Dice simulation scene"></div>
        <div id="hud" class="hud">Awaiting command...</div>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
